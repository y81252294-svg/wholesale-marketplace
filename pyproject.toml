[project]
name = "wholesale-retail-marketplace"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
description = "ML-based wholesale-retail marketplace"
dependencies = [
    "bcrypt==4.3.0",
    "alembic==1.15.2",
    "fastapi==0.115.12",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "psycopg[binary]==3.2.6",
    "PyJWT==2.10.1",
    "scikit-learn==1.6.1",
    "SQLAlchemy==2.0.40",
    "uvicorn[standard]==0.34.0",
]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
